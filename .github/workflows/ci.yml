name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/setup.mjs
      - run: node scripts/setup.mjs scan
      - run: node scripts/setup.mjs selftest
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bootstrap.sh bin/pr-gate
      - name: PowerShell parse (5.1 + 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads BOM-less files as ANSI: non-ASCII bytes break parsing.
          if (Select-String -Path bootstrap.ps1 -Pattern '[^\x00-\x7F]') { "bootstrap.ps1 must be ASCII-only"; exit 1 }
          powershell -NoProfile -Command "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$PWD\bootstrap.ps1',[ref]`$null,[ref]`$e) | Out-Null; if (`$e) { `$e; exit 1 }"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bootstrap.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
